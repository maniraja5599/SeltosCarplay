name: Build & Package IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package SeltosBrowser IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application for iOS Device
        id: build_step
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project SeltosBrowser.xcodeproj \
            -scheme SeltosBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee build.log

      - name: Post-Build Diagnostics to Summary
        if: always()
        run: |
          echo "### Xcodebuild Log Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            grep -C 3 -E "(error:|fatal error:|BUILD FAILED|\*\*)" build.log | head -n 100 >> $GITHUB_STEP_SUMMARY || true
            echo "--- Last 50 lines ---" >> $GITHUB_STEP_SUMMARY
            tail -n 50 build.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No build.log file found." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package Unsigned IPA for Sideloading
        if: success()
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find derived_data -name "SeltosBrowser.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cp -R "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r -9 SeltosBrowser.ipa Payload
            rm -rf Payload
            cd ..
            echo "Successfully created build-output/SeltosBrowser.ipa"
            ls -lh build-output/SeltosBrowser.ipa
          else
            echo "Error: SeltosBrowser.app not found in build products"
            exit 1
          fi

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SeltosBrowser-IPA
          path: build-output/SeltosBrowser.ipa
          if-no-files-found: error
