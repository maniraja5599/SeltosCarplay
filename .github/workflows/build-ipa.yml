name: Build & Package IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package SeltosBrowser IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application for iOS Device
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project SeltosBrowser.xcodeproj \
            -scheme SeltosBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            echo "--- Inspecting Info.plist in compiled app ---"
            plutil -p "$APP_PATH/Info.plist" || cat "$APP_PATH/Info.plist" || true
            echo "---------------------------------------------"
            cp SeltosBrowser/Entitlements/SeltosBrowser.entitlements "$APP_PATH/archived-expanded-entitlements.xcent"
            cp SeltosBrowser/Entitlements/SeltosBrowser.entitlements "$APP_PATH/SeltosBrowser.entitlements"
            cp -R "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r -9 SeltosBrowser.ipa Payload
            rm -rf Payload
            cd ..
            echo "Successfully created build-output/SeltosBrowser.ipa"
            ls -lh build-output/SeltosBrowser.ipa
          else
            echo "Error: Application bundle not found in build products"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeltosBrowser-IPA
          path: build-output/SeltosBrowser.ipa
          if-no-files-found: error
