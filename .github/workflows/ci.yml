name: iOS Build & Package Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build, Test & Package IPA (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify Environment & Tools
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests on iOS Simulator
        run: |
          xcodebuild test \
            -project SeltosBrowser.xcodeproj \
            -scheme SeltosBrowserTests \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Application for Device
        run: |
          xcodebuild build \
            -project SeltosBrowser.xcodeproj \
            -scheme SeltosBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p build-output/Payload
          APP_PATH=$(find derived_data -name "SeltosBrowser.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" build-output/Payload/
            cd build-output
            zip -r -9 SeltosBrowser.ipa Payload
            rm -rf Payload
            cd ..
            echo "Successfully generated SeltosBrowser.ipa"
          else
            echo "Error: SeltosBrowser.app not found in build products"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeltosBrowser-IPA
          path: build-output/SeltosBrowser.ipa
          if-no-files-found: error
