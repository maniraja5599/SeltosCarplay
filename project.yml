name: SeltosBrowser
options:
  bundleIdPrefix: com.private
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO

targets:
  SeltosBrowser:
    type: application
    platform: iOS
    sources:
      - path: SeltosBrowser
    info:
      path: SeltosBrowser/App/Info.plist
      properties:
        CFBundleDisplayName: "Kia Browser"
        CFBundleName: "Kia Browser"
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        UILaunchStoryboardName: "LaunchScreen"
        NSLocationWhenInUseUsageDescription: "Kia Browser uses your motion state to detect vehicle movement."
        NSMicrophoneUsageDescription: "Kia Browser requires microphone access for voice search and web audio features."
        NSSpeechRecognitionUsageDescription: "Kia Browser uses speech recognition for voice search."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: "CPTemplateApplicationScene"
                UISceneConfigurationName: "CarPlay"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    frameworks:
      - framework: WebKit.framework
      - framework: CarPlay.framework
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework
      - framework: CoreLocation.framework
      - framework: Speech.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seltos.browser
        PRODUCT_NAME: SeltosBrowser
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SeltosBrowser/App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Kia Browser"
        INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
