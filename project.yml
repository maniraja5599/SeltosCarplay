name: SeltosBrowser
options:
  bundleIdPrefix: com.private
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    ENABLE_TESTABILITY: YES

targets:
  SeltosBrowser:
    type: application
    platform: iOS
    sources:
      - path: SeltosBrowser
    info:
      path: SeltosBrowser/App/Info.plist
    entitlements:
      path: SeltosBrowser/Entitlements/SeltosBrowser.entitlements
    frameworks:
      - framework: WebKit.framework
      - framework: CarPlay.framework
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework
      - framework: CoreLocation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seltos.browser
        PRODUCT_NAME: SeltosBrowser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SeltosBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeltosBrowserTests
    dependencies:
      - target: SeltosBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seltos.browser.tests

schemes:
  SeltosBrowser:
    build:
      targets:
        SeltosBrowser: all
        SeltosBrowserTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeltosBrowserTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
